openapi: 3.1.0
info:
  title: InvoiceOps API
  version: 1.0.0
  description: >-
    Proposed API for the InvoiceOps hackathon MVP. These are InvoiceOps-owned
    endpoints, not Switch endpoints. Payment-ready means downstream-ready; no
    transfer or bank payment is initiated. Required per-operation authorization scopes are documented in API Design; the x-required-scopes extension is descriptive.
servers:
  - url: http://localhost:8000/api/v1
security:
  - BearerAuth: []
tags:
  - name: Health
  - name: Invoices
  - name: Documents
  - name: Extraction
  - name: Matching
  - name: Exceptions
  - name: Approvals
  - name: PaymentReady
  - name: Audit
paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: Health probe
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
  /invoices:
    get:
      tags: [Invoices]
      summary: List and filter invoices
      parameters:
        - in: query
          name: status
          schema: {type: string}
        - in: query
          name: q
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - in: query
          name: cursor
          schema: {type: string}
      responses:
        '200':
          description: Invoice page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoiceListResponse'}
    post:
      tags: [Invoices]
      summary: Create an invoice case
      security: [{BearerAuth: []}]
      x-required-scopes: [invoice:create]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvoiceCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoiceResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /invoices/{invoiceId}:
    get:
      tags: [Invoices]
      summary: Get invoice case and current workflow state
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: Invoice detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoiceDetailResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /invoices/{invoiceId}/documents:
    post:
      tags: [Documents]
      summary: Upload source document for an invoice
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, document_type]
              properties:
                file: {type: string, format: binary}
                document_type: {type: string, enum: [supplier_invoice, purchase_order, goods_receipt, credit_note, other]}
      responses:
        '201':
          description: Document stored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        '413': {$ref: '#/components/responses/ValidationError'}
  /documents/{documentId}:
    get:
      tags: [Documents]
      summary: Get safe document metadata and extracted text status
      parameters:
        - in: path
          name: documentId
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Document metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
  /invoices/{invoiceId}/extractions:
    post:
      tags: [Extraction]
      summary: Submit agent extraction proposal
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExtractionProposal'}
      responses:
        '201':
          description: Proposal recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExtractionResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /invoices/{invoiceId}/extractions/{extractionId}/confirm:
    post:
      tags: [Extraction]
      summary: Human confirms or corrects extracted values
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
        - in: path
          name: extractionId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExtractionConfirmation'}
      responses:
        '200':
          description: Confirmed extraction version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExtractionResponse'}
  /invoices/{invoiceId}/match-runs:
    post:
      tags: [Matching]
      summary: Run deterministic three-way match
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                policy_version: {type: string, default: demo-policy-1.0}
      responses:
        '201':
          description: Match run completed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatchRun'}
  /invoices/{invoiceId}/match-runs/latest:
    get:
      tags: [Matching]
      summary: Read the latest match run
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: Latest match run
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatchRun'}
  /invoices/{invoiceId}/exceptions/{exceptionId}/evidence:
    post:
      tags: [Exceptions]
      summary: Attach human-confirmed evidence to an exception
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
        - in: path
          name: exceptionId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EvidenceCreate'}
      responses:
        '201':
          description: Evidence recorded; a new match run is still required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvidenceResponse'}
  /invoices/{invoiceId}/exceptions/{exceptionId}/proposals:
    post:
      tags: [Exceptions]
      summary: Create a resolution proposal; does not resolve the exception
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
        - in: path
          name: exceptionId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolutionProposal'}
      responses:
        '201':
          description: Proposal recorded for human review
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResolutionProposalResponse'}
  /invoices/{invoiceId}/approvals:
    post:
      tags: [Approvals]
      summary: Finance human approves or rejects the invoice
      description: Agent identities and AP Clerk roles must be denied by the backend.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalDecision'}
      responses:
        '201':
          description: Decision recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /invoices/{invoiceId}/payment-ready-records:
    post:
      tags: [PaymentReady]
      summary: Create non-payment downstream-ready record after approval
      description: This endpoint does not initiate a bank transfer or call a payment provider.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approval_id]
              properties:
                approval_id: {type: string}
      responses:
        '201':
          description: Payment-ready record created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentReadyRecord'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /payment-ready-records:
    get:
      tags: [PaymentReady]
      summary: List downstream-ready records
      security: [{BearerAuth: []}]
      responses:
        '200':
          description: Records
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PaymentReadyRecord'}
  /invoices/{invoiceId}/audit-events:
    get:
      tags: [Audit]
      summary: Get invoice audit timeline
      security: [{BearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AuditEvent'}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or scoped service token
  parameters:
    InvoiceId:
      in: path
      name: invoiceId
      required: true
      schema: {type: string}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
  responses:
    Forbidden:
      description: Actor lacks the required role or scope
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: Invalid state, stale version or idempotency conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status: {type: string, enum: [ok]}
        version: {type: string}
    InvoiceCreate:
      type: object
      required: [vendor_id, invoice_number, invoice_date, currency, invoice_total]
      properties:
        vendor_id: {type: string}
        invoice_number: {type: string}
        invoice_date: {type: string, format: date}
        po_id: {type: string}
        currency: {type: string, pattern: '^[A-Z]{3}$', default: INR}
        subtotal: {type: string, pattern: '^-?[0-9]+(\\.[0-9]{1,2})?$'}
        tax_total: {type: string, pattern: '^-?[0-9]+(\\.[0-9]{1,2})?$'}
        invoice_total: {type: string, pattern: '^-?[0-9]+(\\.[0-9]{1,2})?$'}
    InvoiceResponse:
      type: object
      properties:
        invoice_id: {type: string}
        status: {type: string}
        version: {type: integer}
    InvoiceListResponse:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/InvoiceResponse'}
        next_cursor: {type: [string, 'null']}
    InvoiceDetailResponse:
      type: object
      properties:
        invoice_id: {type: string}
        vendor_id: {type: string}
        invoice_number: {type: string}
        invoice_date: {type: string, format: date}
        po_id: {type: [string, 'null']}
        currency: {type: string}
        invoice_total: {type: string}
        status: {type: string}
        version: {type: integer}
        latest_match_run: {$ref: '#/components/schemas/MatchRun'}
        open_exceptions:
          type: array
          items: {$ref: '#/components/schemas/Exception'}
    Document:
      type: object
      properties:
        document_id: {type: string}
        invoice_id: {type: string}
        filename: {type: string}
        mime_type: {type: string}
        size_bytes: {type: integer}
        sha256: {type: string}
        document_type: {type: string}
        extraction_status: {type: string}
    Evidence:
      type: object
      required: [field, value, confidence]
      properties:
        field: {type: string}
        value: {type: [string, 'null']}
        confidence: {type: number, minimum: 0, maximum: 1}
        document_id: {type: [string, 'null']}
        page: {type: [integer, 'null']}
        excerpt: {type: [string, 'null']}
    ExtractionProposal:
      type: object
      required: [document_id, fields, lines]
      properties:
        document_id: {type: string}
        fields:
          type: array
          items: {$ref: '#/components/schemas/Evidence'}
        lines:
          type: array
          items:
            type: object
            required: [description, quantity, unit_price]
            properties:
              sku: {type: [string, 'null']}
              description: {type: string}
              quantity: {type: string}
              unit_price: {type: string}
              net_amount: {type: [string, 'null']}
              tax_amount: {type: [string, 'null']}
              source_page: {type: [integer, 'null']}
              confidence: {type: number, minimum: 0, maximum: 1}
    ExtractionConfirmation:
      type: object
      required: [confirmed, comment]
      properties:
        confirmed: {type: boolean}
        comment: {type: string, minLength: 3}
        corrected_fields: {type: object, additionalProperties: true}
    ExtractionResponse:
      type: object
      properties:
        extraction_id: {type: string}
        invoice_id: {type: string}
        status: {type: string}
        requires_human_review: {type: boolean}
    MatchRun:
      type: object
      properties:
        match_run_id: {type: string}
        invoice_id: {type: string}
        overall_status: {type: string, enum: [PASS, BLOCKED, NEEDS_HUMAN]}
        invoice_version: {type: integer}
        po_version: {type: [integer, 'null']}
        grn_version_fingerprint: {type: [string, 'null']}
        policy_version: {type: string}
        checks:
          type: array
          items:
            type: object
            properties:
              code: {type: string}
              status: {type: string, enum: [pass, fail, unknown]}
              severity: {type: string, enum: [info, warning, blocking]}
              message: {type: string}
              expected: {type: [string, 'null']}
              actual: {type: [string, 'null']}
              source_refs:
                type: array
                items: {type: string}
    Exception:
      type: object
      properties:
        exception_id: {type: string}
        code: {type: string}
        status: {type: string}
        owner_role: {type: string}
        description: {type: string}
    EvidenceCreate:
      type: object
      required: [source_type, source_ref, comment]
      properties:
        source_type: {type: string, enum: [grn, po_amendment, human_confirmation, credit_note, other]}
        source_ref: {type: string}
        comment: {type: string, minLength: 3}
    EvidenceResponse:
      type: object
      properties:
        evidence_id: {type: string}
        exception_id: {type: string}
        status: {type: string}
    ResolutionProposal:
      type: object
      required: [proposal_type, rationale, evidence_refs]
      properties:
        proposal_type: {type: string}
        rationale: {type: string}
        evidence_refs:
          type: array
          items: {type: string}
        proposed_payload: {type: object, additionalProperties: true}
    ResolutionProposalResponse:
      type: object
      properties:
        proposal_id: {type: string}
        status: {type: string, enum: [pending_human_review]}
    ApprovalDecision:
      type: object
      required: [decision, comment, match_run_id]
      properties:
        decision: {type: string, enum: [approved, rejected]}
        comment: {type: string, minLength: 3}
        match_run_id: {type: string}
        expected_invoice_version: {type: integer}
    ApprovalResponse:
      type: object
      properties:
        approval_id: {type: string}
        invoice_id: {type: string}
        decision: {type: string}
        approver_id: {type: string}
        created_at: {type: string, format: date-time}
    PaymentReadyRecord:
      type: object
      properties:
        payment_ready_record_id: {type: string}
        invoice_id: {type: string}
        approval_id: {type: string}
        approved_amount: {type: string}
        currency: {type: string}
        status: {type: string, enum: [ready_for_downstream_payment]}
        created_at: {type: string, format: date-time}
        payment_executed: {type: boolean, const: false}
    AuditEvent:
      type: object
      properties:
        event_id: {type: string}
        occurred_at: {type: string, format: date-time}
        actor_id: {type: string}
        actor_type: {type: string, enum: [human, agent, system]}
        action: {type: string}
        entity_type: {type: string}
        entity_id: {type: string}
        reason: {type: [string, 'null']}
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: array, items: {type: object, additionalProperties: true}}
        request_id: {type: string}
